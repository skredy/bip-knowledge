name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Interactive terminal regression
        if: runner.os == 'Linux'
        run: python3 scripts/test-terminal.py
      - run: dotnet pack src/BipKb -c Release --no-restore -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: bip-kb-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            **/TestResults/*.trx
