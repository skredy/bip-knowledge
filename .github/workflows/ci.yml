name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, pack and install through the user script
        shell: pwsh
        run: ./scripts/install.ps1 -ToolPath (Join-Path $env:RUNNER_TEMP 'bip-kb tools')
      - name: Installed business analyst workflow
        shell: pwsh
        run: python scripts/test-business.py --tool (Join-Path $env:RUNNER_TEMP ('bip-kb tools/bip-kb' + $(if ($IsWindows) { '.exe' } else { '' })))
      - name: Interactive terminal regression
        if: runner.os == 'Linux'
        run: python3 scripts/test-terminal.py
      - name: Guided CLI regression
        if: runner.os == 'Linux'
        run: python3 scripts/test-guided.py
      - name: Guided stdin regression
        if: runner.os == 'Linux'
        run: python3 scripts/test-guided.py --stdin
      - name: Installed MCP stdio regression
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark-mcp.py --count 200 --tool "$RUNNER_TEMP/bip-kb tools/bip-kb"
      - name: Installed cache rebuild and compaction regression
        if: runner.os == 'Linux'
        run: python3 scripts/benchmark-cache.py --count 200 --rebuild --tool "$RUNNER_TEMP/bip-kb tools/bip-kb"
      - uses: actions/upload-artifact@v4
        with:
          name: bip-kb-${{ matrix.os }}
          path: |
            artifacts/*.nupkg
            **/TestResults/*.trx
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows desktop
        shell: pwsh
        run: ./scripts/publish-desktop.ps1
      - name: Test packaged CLI and Copilot fixture
        shell: pwsh
        run: python scripts/test-business.py --tool artifacts/desktop-win-x64/BipKb.exe
      - name: Open WPF and exercise workspace screens
        shell: pwsh
        run: ./scripts/test-desktop.ps1 -Directory artifacts/desktop-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: bip-kb-desktop-win-x64
          path: artifacts/desktop-win-x64/
